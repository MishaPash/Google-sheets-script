name: Employee satisfaction OKR (weekly)

# Every Friday: read the weekly Slack Polly office-satisfaction survey from the
# Google Sheet (via the bound Apps Script web app), push the latest completed
# week's satisfaction % into the GetOKRs key result, and open a pull request
# with the report as an audit trail.

on:
  schedule:
    - cron: '0 15 * * 5'   # Fridays at 15:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute + open PR but do NOT write to GetOKRs'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: office-satisfaction
  cancel-in-progress: false

jobs:
  push-check-in:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compute satisfaction and push to GetOKRs
        id: okr
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}
          OKRS_API_KEY: ${{ secrets.OKRS_API_KEY }}
          # Non-secret identifiers; override here only if the KR/org changes.
          OKRS_ORG_ID: ${{ vars.OKRS_ORG_ID }}
          OKRS_KR_ID: ${{ vars.OKRS_KR_ID }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
        run: python office-satisfaction/scripts/push_to_okr.py

      - name: Open pull request with the weekly report
        if: steps.okr.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          # A PAT (not the default GITHUB_TOKEN) so the PR is authored by a real
          # user — that lets the auto-approve workflow approve it (you cannot
          # approve your own PR) and lets it trigger downstream workflows.
          # Falls back to GITHUB_TOKEN if no PAT is configured (then the PR is
          # opened but not auto-approved).
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          branch: okr/weekly-office-satisfaction
          base: main
          add-paths: |
            office-satisfaction/reports/**
            office-satisfaction/data/**
          commit-message: "chore(okr): office satisfaction ${{ steps.okr.outputs.week_date }} = ${{ steps.okr.outputs.satisfaction }}%"
          title: "Office satisfaction ${{ steps.okr.outputs.week_date }}: ${{ steps.okr.outputs.satisfaction }}%"
          body: |
            Automated weekly office-satisfaction check-in.

            - **Week (Polly Date):** ${{ steps.okr.outputs.week_date }}
            - **Satisfaction pushed to GetOKRs:** ${{ steps.okr.outputs.satisfaction }}%
            - **KR:** `[Lagging] Achieve an employee satisfaction rate of at least 90%`

            The value was computed from columns J and M of the weekly Slack Polly
            survey and written to the "OKR Satisfaction" tab of the source sheet.

            _Generated by the `office-satisfaction` GitHub Action._
          labels: okr-automation
