name: Daily Task Tracker Automation

# Runs: every day at 06:00 UTC (~09:00 Kyiv time) + manual run from the Actions tab.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Apps Script web app
        env:
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
          WEBAPP_TOKEN: ${{ secrets.WEBAPP_TOKEN }}
        run: |
          set -euo pipefail
          echo "Calling the Apps Script web app..."
          response=$(curl -sS -L -f -G "$WEBAPP_URL" \
            --data-urlencode "token=$WEBAPP_TOKEN" \
            --retry 3 --retry-delay 5)
          echo "Response from Apps Script:"
          echo "$response"
          # If Apps Script returned an error message, mark this step as failed.
          if echo "$response" | grep -qi "ERROR\|Forbidden"; then
            echo "::error::Apps Script reported an error (see the response above)."
            exit 1
          fi
