name: Daily Task Tracker Automation

# Запуск: каждый день в 06:00 UTC (~09:00 по Киеву) + ручной запуск из вкладки Actions.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Apps Script web app
        env:
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
          WEBAPP_TOKEN: ${{ secrets.WEBAPP_TOKEN }}
        run: |
          set -euo pipefail
          echo "Дёргаем веб-приложение Apps Script..."
          response=$(curl -sS -L -f -G "$WEBAPP_URL" \
            --data-urlencode "token=$WEBAPP_TOKEN" \
            --retry 3 --retry-delay 5)
          echo "Ответ от Apps Script:"
          echo "$response"
          # Если Apps Script вернул текст с ошибкой — пометить шаг как упавший.
          if echo "$response" | grep -qi "ERROR\|Forbidden"; then
            echo "::error::Apps Script сообщил об ошибке (см. ответ выше)."
            exit 1
          fi
