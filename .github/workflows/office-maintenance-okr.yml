name: Office maintenance OKR (weekly)

# Every Friday night (Florida time): ask the bound Apps Script web app whether
# the "Form Responses 2" tab has a Google-Form response for the current week,
# push 1 (yes) or 0 (no) as a check-in into the GetOKRs key result
# "[Leading] Complete weekly preventive office maintenance checklist", and open
# a pull request with the report as an audit trail. The existing auto-approve
# workflow then approves + merges it.
#
# Cron is UTC and does NOT follow DST. '50 3 * * 6' = Saturday 03:50 UTC:
#   - EDT (summer, UTC-4)  -> Friday 23:50 local
#   - EST (winter, UTC-5)  -> Friday 22:50 local
# Both are Friday evening in Florida, after the weekly checklist is submitted.

on:
  schedule:
    - cron: '50 3 * * 6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute + open PR but do NOT write to GetOKRs'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: office-maintenance-okr
  cancel-in-progress: false

jobs:
  push-check-in:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check weekly form + push to GetOKRs
        id: okr
        env:
          # Same web app as the office-issues automation (same spreadsheet).
          APPS_SCRIPT_URL: ${{ secrets.OFFICE_ISSUES_APPS_SCRIPT_URL }}
          APPS_SCRIPT_TOKEN: ${{ secrets.OFFICE_ISSUES_APPS_SCRIPT_TOKEN }}
          OKRS_API_KEY: ${{ secrets.OKRS_API_KEY }}
          OKRS_ORG_ID: ${{ vars.OKRS_ORG_ID }}
          OFFICE_MAINT_KR_ID: ${{ vars.OFFICE_MAINT_KR_ID }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
        run: python office-maintenance-okr/scripts/push_to_okr.py

      - name: Open pull request with the weekly report
        if: steps.okr.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          # PAT so the PR is authored by a real user and the existing
          # auto-approve workflow can approve it.
          token: ${{ secrets.Moa_PAT || secrets.GITHUB_TOKEN }}
          branch: okr/weekly-office-maintenance
          base: main
          add-paths: |
            office-maintenance-okr/reports/**
            office-maintenance-okr/data/**
          commit-message: "chore(okr): weekly maintenance ${{ steps.okr.outputs.week_end }} = ${{ steps.okr.outputs.value }}"
          title: "Weekly maintenance ${{ steps.okr.outputs.week_end }}: ${{ steps.okr.outputs.value }}"
          body: |
            Automated weekly maintenance-checklist check-in.

            - **Week ending:** ${{ steps.okr.outputs.week_end }}
            - **Value pushed to GetOKRs:** ${{ steps.okr.outputs.value }} (1 = checklist completed, 0 = not)
            - **Form responses this week:** ${{ steps.okr.outputs.count }}
            - **Check-in posted:** ${{ steps.okr.outputs.posted }}
            - **KR:** `[Leading] Complete weekly preventive office maintenance checklist`

            Source: presence of a response in the "Form Responses 2" tab for the
            current week.

            _Generated by the `office-maintenance-okr` GitHub Action._
          labels: okr-automation
