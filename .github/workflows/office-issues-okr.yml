name: Office issues OKR (daily)

# Every day: read the "% on-time" (column E) for today's date from the
# "OKR Summary" tab of the office-issues Google Sheet (via the bound Apps
# Script web app), push it as a check-in into the GetOKRs key result
# "[Leading] Resolve office-related issues within deadline >= 90%", and open
# a pull request with the report as an audit trail. The existing
# auto-approve workflow then approves + merges it.

on:
  schedule:
    - cron: '0 14 * * *'   # every day at 14:00 UTC (~10:00 America/New_York)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute + open PR but do NOT write to GetOKRs'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: office-issues-okr
  cancel-in-progress: false

jobs:
  push-check-in:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compute % on-time and push to GetOKRs
        id: okr
        env:
          OFFICE_ISSUES_APPS_SCRIPT_URL: ${{ secrets.OFFICE_ISSUES_APPS_SCRIPT_URL }}
          OFFICE_ISSUES_APPS_SCRIPT_TOKEN: ${{ secrets.OFFICE_ISSUES_APPS_SCRIPT_TOKEN }}
          OKRS_API_KEY: ${{ secrets.OKRS_API_KEY }}
          # Non-secret identifiers; the script has correct defaults, override
          # via repo Variables only if the KR/org ever changes.
          OKRS_ORG_ID: ${{ vars.OKRS_ORG_ID }}
          OFFICE_ISSUES_KR_ID: ${{ vars.OFFICE_ISSUES_KR_ID }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
        run: python office-issues-okr/scripts/push_to_okr.py

      - name: Open pull request with the daily report
        if: steps.okr.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          # A PAT (not the default GITHUB_TOKEN) so the PR is authored by a real
          # user — that lets the existing auto-approve workflow approve it (you
          # cannot approve your own PR) and lets it trigger downstream workflows.
          # Falls back to GITHUB_TOKEN if no PAT is configured (then the PR is
          # opened but not auto-approved).
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          branch: okr/daily-office-issues
          base: main
          add-paths: |
            office-issues-okr/reports/**
            office-issues-okr/data/**
          commit-message: "chore(okr): office issues on-time ${{ steps.okr.outputs.date }} = ${{ steps.okr.outputs.value }}%"
          title: "Office issues on-time ${{ steps.okr.outputs.date }}: ${{ steps.okr.outputs.value }}%"
          body: |
            Automated daily office-issues check-in.

            - **Date:** ${{ steps.okr.outputs.date }}
            - **% on-time pushed to GetOKRs:** ${{ steps.okr.outputs.value }}%
            - **Source row date:** ${{ steps.okr.outputs.matched_date }}
            - **Check-in posted:** ${{ steps.okr.outputs.posted }}
            - **KR:** `[Leading] Resolve office-related issues within deadline >= 90%`

            The value is column E ("% on-time") of the "OKR Summary" tab of the
            source sheet, for today's date.

            _Generated by the `office-issues-okr` GitHub Action._
          labels: okr-automation
